<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>초등 국어 어휘 드릴</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;700;900&family=Gowun+Dodum&display=swap');

  :root {
    --bg: #f0f7ff;
    --surface: #ffffff;
    --surface2: #e8f1fc;
    --border: #c2d8f5;
    --accent: #3b82f6;
    --accent2: #f43f8e;
    --accent3: #f59e0b;
    --text: #1e3a5f;
    --text-muted: #6b8ab0;
    --success: #10b981;
    --fail: #ef4444;
    --grade-colors: #3b82f6, #8b5cf6, #f97316, #10b981, #ec4899, #f59e0b;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: 'Noto Sans KR', sans-serif;
    background: var(--bg);
    background-image:
      radial-gradient(circle at 20% 20%, rgba(147,197,253,.35) 0%, transparent 50%),
      radial-gradient(circle at 80% 80%, rgba(253,186,252,.25) 0%, transparent 50%),
      radial-gradient(circle at 60% 10%, rgba(167,243,208,.25) 0%, transparent 40%);
    color: var(--text);
    min-height: 100vh;
    overflow-x: hidden;
  }

  /* ── 배경 파티클 ── */
  #bg-canvas {
    position: fixed; inset: 0; z-index: 0; pointer-events: none;
  }

  .wrap { position: relative; z-index: 1; }

  /* ── 헤더 ── */
  header {
    text-align: center;
    padding: 14px 20px 8px;
  }
  header .logo { display: none; }
  header h1 {
    font-size: clamp(17px, 3vw, 24px);
    font-weight: 900;
    background: linear-gradient(135deg, #3b82f6, #6366f1, #f43f8e);
    -webkit-background-clip: text; -webkit-text-fill-color: transparent;
    line-height: 1.2;
  }
  header p { display: none; }

  /* ── 학년 선택 탭 ── */
  .grade-tabs {
    display: flex; gap: 8px; justify-content: center; flex-wrap: wrap;
    padding: 0 16px 12px;
  }
  .grade-tab {
    padding: 8px 20px; border-radius: 50px;
    border: 1.5px solid var(--border);
    background: var(--surface); color: var(--text-muted);
    font-size: 14px; font-weight: 700; cursor: pointer;
    transition: all .2s; font-family: 'Noto Sans KR', sans-serif;
  }
  .grade-tab:hover { border-color: var(--accent); color: var(--accent); }
  .grade-tab.active {
    background: var(--accent); border-color: var(--accent);
    color: #fff; box-shadow: 0 0 20px rgba(108,143,255,.35);
  }

  /* ── 모드 선택 ── */
  .mode-bar {
    display: flex; gap: 10px; justify-content: center; flex-wrap: wrap;
    padding: 0 16px 10px;
  }
  .mode-btn {
    display: flex; align-items: center; gap: 7px;
    padding: 10px 22px; border-radius: 12px;
    border: 1.5px solid var(--border);
    background: var(--surface); color: var(--text-muted);
    font-size: 13px; font-weight: 700; cursor: pointer;
    transition: all .2s; font-family: 'Noto Sans KR', sans-serif;
  }
  .mode-btn .icon { font-size: 18px; }
  .mode-btn:hover { border-color: var(--accent2); color: var(--accent2); }
  .mode-btn.active {
    background: linear-gradient(135deg, #ff7eb3, #ff6b8a);
    border-color: transparent; color: #fff;
    box-shadow: 0 0 20px rgba(255,126,179,.3);
  }

  /* ── 진행 상태 ── */
  .progress-bar-wrap {
    max-width: 640px; margin: 0 auto 10px; padding: 0 20px;
  }
  .progress-info {
    display: flex; justify-content: space-between;
    font-size: 12px; color: var(--text-muted); margin-bottom: 8px;
  }
  .progress-track {
    height: 6px; background: var(--surface2); border-radius: 10px; overflow: hidden;
  }
  .progress-fill {
    height: 100%; border-radius: 10px;
    background: linear-gradient(90deg, var(--accent), var(--accent2));
    transition: width .4s ease;
  }

  /* ── 점수 칩 ── */
  .score-chips {
    display: flex; gap: 12px; justify-content: center; margin-bottom: 12px;
  }
  .chip {
    padding: 6px 18px; border-radius: 50px; font-size: 13px; font-weight: 700;
  }
  .chip.correct { background: rgba(67,217,173,.15); color: var(--success); border: 1px solid rgba(67,217,173,.3); }
  .chip.wrong   { background: rgba(255,107,138,.15); color: var(--fail);    border: 1px solid rgba(255,107,138,.3); }

  /* ── 카드 영역 ── */
  .card-area {
    max-width: 640px; margin: 0 auto; padding: 0 16px 40px;
  }

  /* ── 드릴 카드 ── */
  .drill-card {
    background: var(--surface);
    border: 1.5px solid var(--border);
    border-radius: 24px;
    padding: 22px 24px;
    position: relative;
    overflow: hidden;
    animation: cardIn .3s ease;
    box-shadow: 0 4px 24px rgba(59,130,246,.10), 0 1px 4px rgba(0,0,0,.06);
  }
  .drill-card::before {
    content: '';
    position: absolute; top: -60px; right: -60px;
    width: 180px; height: 180px; border-radius: 50%;
    background: radial-gradient(circle, rgba(59,130,246,.10), transparent 70%);
  }
  @keyframes cardIn {
    from { opacity: 0; transform: translateY(16px) scale(.97); }
    to   { opacity: 1; transform: translateY(0) scale(1); }
  }

  .q-meta {
    display: flex; align-items: center; gap: 8px; margin-bottom: 20px;
  }
  .q-badge {
    font-size: 11px; font-weight: 700; letter-spacing: 2px;
    padding: 4px 12px; border-radius: 50px;
    background: rgba(108,143,255,.15); color: var(--accent);
  }
  .q-num { font-size: 12px; color: var(--text-muted); margin-left: auto; }

  .q-word {
    font-size: clamp(32px, 7vw, 52px);
    font-weight: 900; letter-spacing: -1px;
    margin-bottom: 4px;
    background: linear-gradient(135deg, #1e3a5f, #3b82f6);
    -webkit-background-clip: text; -webkit-text-fill-color: transparent;
  }
  .q-hanja {
    font-size: 16px; color: var(--text-muted); margin-bottom: 28px;
    font-family: 'Gowun Dodum', serif;
  }

  /* 뜻 고르기 – 보기 4개 */
  .choices {
    display: grid; grid-template-columns: 1fr 1fr; gap: 10px;
  }
  .choice-btn {
    padding: 14px 12px; border-radius: 14px; text-align: left;
    border: 1.5px solid var(--border);
    background: var(--surface2); color: var(--text);
    font-size: 13px; line-height: 1.5; cursor: pointer;
    transition: all .18s; font-family: 'Noto Sans KR', sans-serif;
    font-weight: 500;
  }
  .choice-btn:hover:not(:disabled) { border-color: var(--accent); background: rgba(108,143,255,.08); }
  .choice-btn.correct { border-color: var(--success); background: rgba(67,217,173,.12); color: var(--success); }
  .choice-btn.wrong   { border-color: var(--fail);    background: rgba(255,107,138,.12); color: var(--fail); }
  .choice-btn:disabled { cursor: default; }

  /* 빈칸 채우기 */
  .fill-area { display: flex; flex-direction: column; gap: 14px; }
  .fill-hint { font-size: 15px; color: var(--text-muted); line-height: 1.8; }
  .fill-hint strong { color: var(--accent3); font-size: 18px; }
  .fill-input {
    width: 100%; padding: 14px 18px; border-radius: 14px;
    border: 1.5px solid var(--border); background: var(--surface2);
    color: var(--text); font-size: 16px; font-weight: 700;
    font-family: 'Noto Sans KR', sans-serif; outline: none;
    transition: border-color .2s;
  }
  .fill-input:focus { border-color: var(--accent); }
  .fill-input.correct { border-color: var(--success); background: rgba(67,217,173,.08); }
  .fill-input.wrong   { border-color: var(--fail);    background: rgba(255,107,138,.08); }

  .submit-btn {
    width: 100%; padding: 14px; border-radius: 14px; border: none;
    background: linear-gradient(135deg, var(--accent), #818cf8);
    color: #fff; font-size: 15px; font-weight: 700;
    font-family: 'Noto Sans KR', sans-serif; cursor: pointer;
    transition: opacity .2s, transform .1s;
  }
  .submit-btn:hover { opacity: .9; transform: translateY(-1px); }
  .submit-btn:active { transform: translateY(0); }

  /* 플래시 카드 */
  .flash-wrap { perspective: 1000px; }
  .flash-card {
    position: relative; height: 240px; cursor: pointer;
    transform-style: preserve-3d; transition: transform .5s;
  }
  .flash-card.flipped { transform: rotateY(180deg); }
  .flash-face {
    position: absolute; inset: 0; border-radius: 20px;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    backface-visibility: hidden; padding: 28px;
  }
  .flash-front {
    background: linear-gradient(135deg, #dbeafe, #ede9fe);
    border: 1.5px solid var(--border);
  }
  .flash-back {
    background: linear-gradient(135deg, #d1fae5, #a7f3d0);
    border: 1.5px solid rgba(16,185,129,.3);
    transform: rotateY(180deg);
  }
  .flash-word { font-size: 44px; font-weight: 900; color: #1e3a5f; margin-bottom: 6px; }
  .flash-hanja { font-size: 18px; color: var(--text-muted); font-family: 'Gowun Dodum', serif; }
  .flash-meaning { font-size: 16px; color: #065f46; text-align: center; line-height: 1.7; font-weight: 500; }
  .flash-tap { font-size: 12px; color: var(--text-muted); position: absolute; bottom: 16px; }

  /* 결과 피드백 */
  .feedback {
    margin-top: 14px; padding: 14px 18px; border-radius: 14px;
    font-size: 14px; font-weight: 500; line-height: 1.6;
    animation: fadeUp .25s ease;
  }
  .feedback.correct { background: rgba(67,217,173,.1); border: 1px solid rgba(67,217,173,.25); color: var(--success); }
  .feedback.wrong   { background: rgba(255,107,138,.1); border: 1px solid rgba(255,107,138,.25); color: var(--fail); }
  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(6px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  /* 다음 버튼 */
  .next-btn {
    width: 100%; margin-top: 14px; padding: 14px; border-radius: 14px; border: none;
    background: var(--surface2); color: var(--text);
    font-size: 14px; font-weight: 700; font-family: 'Noto Sans KR', sans-serif;
    cursor: pointer; border: 1.5px solid var(--border);
    transition: all .18s; display: flex; align-items: center; justify-content: center; gap: 6px;
  }
  .next-btn:hover { border-color: var(--accent); color: var(--accent); }
  .flash-nav {
    display: flex; gap: 10px; margin-top: 18px;
  }
  .flash-nav button {
    flex: 1; padding: 12px; border-radius: 12px; border: 1.5px solid var(--border);
    background: var(--surface2); color: var(--text);
    font-size: 14px; font-weight: 700; font-family: 'Noto Sans KR', sans-serif;
    cursor: pointer; transition: all .18s;
  }
  .flash-nav button:hover { border-color: var(--accent); color: var(--accent); }

  /* 결과 화면 */
  .result-screen {
    max-width: 640px; margin: 0 auto; padding: 0 16px 60px;
    text-align: center; animation: cardIn .4s ease;
  }
  .result-emoji { font-size: 64px; margin-bottom: 16px; }
  .result-title { font-size: 28px; font-weight: 900; margin-bottom: 8px; }
  .result-score {
    font-size: 56px; font-weight: 900;
    background: linear-gradient(135deg, var(--accent), var(--accent2));
    -webkit-background-clip: text; -webkit-text-fill-color: transparent;
    margin: 20px 0;
  }
  .result-detail { color: var(--text-muted); font-size: 14px; margin-bottom: 32px; }
  .result-btns { display: flex; gap: 12px; justify-content: center; }
  .result-btn {
    padding: 13px 28px; border-radius: 50px; font-size: 14px; font-weight: 700;
    font-family: 'Noto Sans KR', sans-serif; cursor: pointer; transition: all .2s;
  }
  .result-btn.primary {
    background: linear-gradient(135deg, var(--accent), #818cf8); border: none; color: #fff;
    box-shadow: 0 0 20px rgba(108,143,255,.3);
  }
  .result-btn.secondary {
    background: var(--surface2); border: 1.5px solid var(--border); color: var(--text);
  }
  .result-btn:hover { transform: translateY(-2px); }

  /* 단어 목록 뷰 */
  .vocab-list {
    max-width: 720px; margin: 0 auto; padding: 0 16px 60px;
  }
  .vocab-grid {
    display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 10px;
  }
  .vocab-item {
    background: var(--surface); border: 1.5px solid var(--border);
    border-radius: 14px; padding: 14px 16px; cursor: pointer;
    transition: all .18s;
  }
  .vocab-item:hover { border-color: var(--accent); transform: translateY(-2px); }
  .vocab-item .v-word { font-size: 18px; font-weight: 900; color: var(--text); }
  .vocab-item .v-hanja { font-size: 12px; color: var(--text-muted); margin: 2px 0 6px; }
  .vocab-item .v-meaning { font-size: 12px; color: var(--text-muted); line-height: 1.5; }

  /* ── 어휘 상세 모달 ── */
  .vocab-modal-overlay {
    position: fixed; inset: 0; z-index: 999;
    background: rgba(30, 58, 95, 0.45);
    backdrop-filter: blur(6px);
    display: flex; align-items: center; justify-content: center;
    animation: fadeOverlay .2s ease;
  }
  @keyframes fadeOverlay { from { opacity: 0; } to { opacity: 1; } }
  .vocab-modal {
    background: #fff; border-radius: 28px; padding: 44px 40px 36px;
    max-width: 420px; width: 90%;
    box-shadow: 0 20px 60px rgba(59,130,246,.18), 0 4px 16px rgba(0,0,0,.08);
    text-align: center; position: relative;
    animation: modalPop .25s cubic-bezier(.34,1.56,.64,1);
  }
  @keyframes modalPop {
    from { opacity: 0; transform: scale(.85) translateY(20px); }
    to   { opacity: 1; transform: scale(1) translateY(0); }
  }
  .vocab-modal-close {
    position: absolute; top: 16px; right: 18px;
    background: #f0f7ff; border: none; border-radius: 50%;
    width: 32px; height: 32px; font-size: 16px; cursor: pointer;
    color: #6b8ab0; line-height: 32px; transition: background .15s;
  }
  .vocab-modal-close:hover { background: #dbeafe; color: #3b82f6; }
  .vocab-modal-num { font-size: 12px; color: #6b8ab0; letter-spacing: 2px; font-weight: 700; margin-bottom: 14px; }
  .vocab-modal-word {
    font-size: clamp(48px, 12vw, 72px); font-weight: 900; letter-spacing: -2px; line-height: 1;
    background: linear-gradient(135deg, #1e3a5f, #3b82f6);
    -webkit-background-clip: text; -webkit-text-fill-color: transparent; margin-bottom: 10px;
  }
  .vocab-modal-hanja { font-size: 20px; color: #6b8ab0; margin-bottom: 22px; font-family: 'Gowun Dodum', serif; }
  .vocab-modal-divider { height: 2px; background: linear-gradient(90deg, transparent, #c2d8f5, transparent); margin: 0 auto 22px; width: 60%; }
  .vocab-modal-meaning { font-size: 18px; color: #1e3a5f; line-height: 1.7; font-weight: 500; margin-bottom: 28px; }
  .vocab-modal-nav { display: flex; gap: 10px; justify-content: center; }
  .vocab-modal-nav button {
    padding: 10px 24px; border-radius: 50px; font-size: 13px; font-weight: 700;
    font-family: 'Noto Sans KR', sans-serif; cursor: pointer; transition: all .18s;
    border: 1.5px solid #c2d8f5; background: #f0f7ff; color: #3b82f6;
  }
  .vocab-modal-nav button:hover { background: #3b82f6; color: #fff; border-color: #3b82f6; }
  .vocab-modal-nav button.primary { background: linear-gradient(135deg, #3b82f6, #6366f1); border-color: transparent; color: #fff; }
  .vocab-modal-nav button.primary:hover { opacity: .88; }

  /* 도구 바 */
  .toolbar {
    display: flex; gap: 8px; justify-content: center; flex-wrap: wrap;
    padding: 0 16px 8px; max-width: 640px; margin: 0 auto;
  }
  .tool-btn {
    padding: 8px 16px; border-radius: 50px; font-size: 12px; font-weight: 700;
    border: 1.5px solid var(--border); background: var(--surface);
    color: var(--text-muted); cursor: pointer; transition: all .18s;
    font-family: 'Noto Sans KR', sans-serif;
  }
  .tool-btn:hover { border-color: var(--accent3); color: var(--accent3); }

  /* ── 모둠 퀴즈 설정 화면 ── */
  .team-setup {
    max-width: 520px; margin: 0 auto; padding: 0 16px 40px;
    animation: cardIn .3s ease;
  }
  .team-setup-card {
    background: var(--surface); border: 1.5px solid var(--border);
    border-radius: 24px; padding: 28px 28px 24px;
    box-shadow: 0 4px 24px rgba(59,130,246,.10);
  }
  .team-setup-title {
    font-size: 18px; font-weight: 900; margin-bottom: 20px; text-align: center;
    background: linear-gradient(135deg, #3b82f6, #f43f8e);
    -webkit-background-clip: text; -webkit-text-fill-color: transparent;
  }
  .setup-row { margin-bottom: 18px; }
  .setup-label {
    font-size: 13px; font-weight: 700; color: var(--text-muted);
    margin-bottom: 8px; display: block;
  }
  .team-count-btns { display: flex; gap: 8px; flex-wrap: wrap; }
  .tc-btn {
    padding: 8px 16px; border-radius: 50px; border: 1.5px solid var(--border);
    background: var(--surface2); color: var(--text-muted);
    font-size: 13px; font-weight: 700; cursor: pointer;
    font-family: 'Noto Sans KR', sans-serif; transition: all .18s;
  }
  .tc-btn.active { background: var(--accent); border-color: var(--accent); color: #fff; }
  .timer-row { display: flex; align-items: center; gap: 12px; }
  .timer-select {
    flex: 1; padding: 10px 14px; border-radius: 12px;
    border: 1.5px solid var(--border); background: var(--surface2);
    font-size: 14px; font-weight: 700; font-family: 'Noto Sans KR', sans-serif;
    color: var(--text); outline: none; cursor: pointer;
  }
  .q-count-select {
    width: 100%; padding: 10px 14px; border-radius: 12px;
    border: 1.5px solid var(--border); background: var(--surface2);
    font-size: 14px; font-weight: 700; font-family: 'Noto Sans KR', sans-serif;
    color: var(--text); outline: none; cursor: pointer;
  }
  .team-names-grid {
    display: grid; grid-template-columns: 1fr 1fr; gap: 8px;
  }
  .team-name-input {
    padding: 10px 14px; border-radius: 12px;
    border: 1.5px solid var(--border); background: var(--surface2);
    font-size: 13px; font-weight: 700; font-family: 'Noto Sans KR', sans-serif;
    color: var(--text); outline: none; transition: border-color .2s;
  }
  .team-name-input:focus { border-color: var(--accent); }
  .start-quiz-btn {
    width: 100%; padding: 15px; border-radius: 14px; border: none;
    background: linear-gradient(135deg, #f43f8e, #f97316);
    color: #fff; font-size: 16px; font-weight: 900;
    font-family: 'Noto Sans KR', sans-serif; cursor: pointer;
    transition: opacity .2s, transform .1s;
    box-shadow: 0 4px 16px rgba(244,63,142,.3);
    margin-top: 8px;
  }
  .start-quiz-btn:hover { opacity: .9; transform: translateY(-1px); }

  /* ── 모둠 퀴즈 진행 화면 ── */
  .team-quiz-wrap { max-width: 700px; margin: 0 auto; padding: 0 14px 40px; }

  /* 상단 타이머 바 */
  .tq-header {
    display: flex; align-items: center; gap: 12px;
    background: var(--surface); border: 1.5px solid var(--border);
    border-radius: 16px; padding: 10px 18px; margin-bottom: 14px;
    box-shadow: 0 2px 12px rgba(59,130,246,.08);
  }
  .tq-timer-ring {
    position: relative; width: 52px; height: 52px; flex-shrink: 0;
  }
  .tq-timer-ring svg { transform: rotate(-90deg); }
  .tq-timer-ring circle { fill: none; stroke-width: 4; }
  .tq-timer-ring .track { stroke: var(--surface2); }
  .tq-timer-ring .fill  { stroke: var(--accent); stroke-linecap: round; transition: stroke-dashoffset .5s linear, stroke .3s; }
  .tq-timer-num {
    position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
    font-size: 15px; font-weight: 900; color: var(--text);
  }
  .tq-meta { flex: 1; min-width: 0; }
  .tq-qnum { font-size: 11px; color: var(--text-muted); font-weight: 700; letter-spacing: 1px; }
  .tq-current-team {
    font-size: 15px; font-weight: 900; margin-top: 2px;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .tq-pause-btn {
    padding: 7px 14px; border-radius: 50px; border: 1.5px solid var(--border);
    background: var(--surface2); font-size: 12px; font-weight: 700;
    font-family: 'Noto Sans KR', sans-serif; cursor: pointer; color: var(--text-muted);
    transition: all .18s; white-space: nowrap;
  }
  .tq-pause-btn:hover { border-color: var(--accent); color: var(--accent); }

  /* ── 모둠별 타이머 (문제당) ── */
  .tq-team-timer-ring {
    position: relative; width: 90px; height: 90px; flex-shrink: 0;
  }
  .tq-team-timer-ring svg { transform: rotate(-90deg); }
  .tq-team-timer-ring circle { fill: none; stroke-width: 7; }
  .tq-team-timer-ring .track { stroke: var(--surface2); }
  .tq-team-timer-ring .fill  { stroke-linecap: round; transition: stroke-dashoffset .25s linear, stroke .3s; }
  .tq-team-timer-num-big {
    position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;

let grade = 3;
let mode = 'choice';
let queue = [];
let current = 0;
let correctCount = 0;
let wrongCount = 0;
let wrongList = [];
let answered = false;
let flashFlipped = false;

// ============================================================
// 초기화
// ============================================================
function init() {
  buildGradeTabs();
  setGrade(3);
  drawBg();
}

function buildGradeTabs() {
  const c = document.getElementById('gradeTabs');
  for (let g = 1; g <= 6; g++) {
    const btn = document.createElement('button');
    btn.className = 'grade-tab' + (g === grade ? ' active' : '');
    btn.textContent = g + '학년';
    btn.onclick = () => setGrade(g);
    c.appendChild(btn);
  }
}

function setGrade(g) {
  grade = g;
  document.querySelectorAll('.grade-tab').forEach((b, i) => {
    b.classList.toggle('active', i + 1 === g);
  });
  resetDrill();
}

function setMode(m) {
  mode = m;
  document.querySelectorAll('.mode-btn').forEach(b => {
    b.classList.toggle('active', b.dataset.mode === m);
  });
  const isGame = ['choice','fill'].includes(m);
  document.getElementById('toolbar').style.display = isGame ? 'flex' : 'none';
  document.getElementById('progressWrap').style.display = ['choice','fill','flash'].includes(m) ? 'block' : 'none';
  document.getElementById('scoreChips').style.display = isGame ? 'flex' : 'none';

  // 모둠 퀴즈 영역 표시
  document.getElementById('teamSetupArea').style.display = 'none';
  document.getElementById('teamQuizArea').style.display = 'none';
  document.getElementById('teamResultArea').style.display = 'none';

  if (m === 'list') {
    renderList();
  } else if (m === 'team') {
    document.getElementById('cardArea').style.display = 'none';
    document.getElementById('vocabListArea').style.display = 'none';
    document.getElementById('resultScreen').style.display = 'none';
    document.getElementById('progressWrap').style.display = 'none';
    document.getElementById('scoreChips').style.display = 'none';
    document.getElementById('toolbar').style.display = 'none';
    showTeamSetup();
  } else {
    resetDrill();
  }
}

function resetDrill() {
  queue = [...VOCAB[grade]];
  current = 0; correctCount = 0; wrongCount = 0; wrongList = [];
  answered = false; flashFlipped = false;
  updateScore();
  document.getElementById('vocabListArea').style.display = 'none';
  document.getElementById('resultScreen').style.display = 'none';
  document.getElementById('cardArea').style.display = 'block';
  renderCard();
}

function shuffleAndStart() {
  queue = shuffle([...VOCAB[grade]]);
  current = 0; correctCount = 0; wrongCount = 0; wrongList = [];
  answered = false; flashFlipped = false;
  updateScore();
  renderCard();
}

function wrongOnly() {
  if (!wrongList.length) { alert('틀린 어휘가 없어요! 👏'); return; }
  queue = shuffle([...wrongList]);
  current = 0; correctCount = 0; wrongCount = 0; wrongList = [];
  answered = false;
  updateScore();
  renderCard();
}

function shuffle(arr) {
  for (let i = arr.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [arr[i], arr[j]] = [arr[j], arr[i]];
  }
  return arr;
}

function updateProgress() {
  const total = queue.length;
  const done = current;
  const pct = total ? Math.round(done / total * 100) : 0;
  document.getElementById('progressText').textContent = `${done} / ${total}`;
  document.getElementById('progressPct').textContent = pct + '%';
  document.getElementById('progressFill').style.width = pct + '%';
}

function updateScore() {
  document.getElementById('correctCount').textContent = correctCount;
  document.getElementById('wrongCount').textContent = wrongCount;
  updateProgress();
}

// ============================================================
// 카드 렌더링
// ============================================================
function renderCard() {
  updateProgress();
  if (mode === 'list') { renderList(); return; }

  const area = document.getElementById('cardArea');
  area.style.display = 'block';
  document.getElementById('vocabListArea').style.display = 'none';
  document.getElementById('resultScreen').style.display = 'none';

  if (current >= queue.length) {
    showResult();
    return;
  }

  const item = queue[current];
  answered = false;
  flashFlipped = false;

  if (mode === 'choice') renderChoice(item, area);
  else if (mode === 'fill') renderFill(item, area);
  else if (mode === 'flash') renderFlash(item, area);
}

function renderChoice(item, area) {
  const others = VOCAB[grade].filter(v => v.w !== item.w);
  const wrong3 = shuffle(others).slice(0, 3);
  const choices = shuffle([item, ...wrong3]);

  area.innerHTML = `
    <div class="drill-card">
      <div class="q-meta">
        <span class="q-badge">뜻 고르기</span>
        <span class="q-num">${current + 1} / ${queue.length}</span>
      </div>
      <div class="q-word">${item.w}</div>
      <div class="q-hanja">${item.h}</div>
      <div class="choices" id="choices">
        ${choices.map((c, i) => `
          <button class="choice-btn" onclick="checkChoice(this,'${c.w === item.w}','${item.m.replace(/'/g,"\\'")}')">
            ${c.m}
          </button>`).join('')}
      </div>
      <div id="feedback"></div>
    </div>`;
}

function checkChoice(btn, isCorrect, meaning) {
  if (answered) return;
  answered = true;

  document.querySelectorAll('.choice-btn').forEach(b => {
    b.disabled = true;
    if (b.textContent.trim() === meaning) b.classList.add('correct');
  });

  if (isCorrect === 'true') {
    btn.classList.add('correct');
    correctCount++;
    showFeedback(true, '정답이에요! 🎉');
  } else {
    btn.classList.add('wrong');
    wrongCount++;
    wrongList.push(queue[current]);
    showFeedback(false, `틀렸어요 😢 정답: "${meaning}"`);
  }
  updateScore();
  addNextBtn();
}

function renderFill(item, area) {
  // 뜻을 주고 어휘를 입력
  area.innerHTML = `
    <div class="drill-card">
      <div class="q-meta">
        <span class="q-badge">빈칸 채우기</span>
        <span class="q-num">${current + 1} / ${queue.length}</span>
      </div>
      <div class="fill-area">
        <div class="fill-hint">뜻: <strong>${item.m}</strong></div>
        <div class="fill-hint" style="font-size:14px;color:var(--text-muted)">한자: ${item.h}</div>
        <input class="fill-input" id="fillInput" type="text" placeholder="어휘를 입력하세요"
          maxlength="10"
          onkeydown="if(event.key==='Enter')checkFill('${item.w}')">
        <button class="submit-btn" onclick="checkFill('${item.w}')">확인</button>
      </div>
      <div id="feedback"></div>
    </div>`;
  setTimeout(() => document.getElementById('fillInput')?.focus(), 100);
}

function checkFill(answer) {
  if (answered) return;
  const inp = document.getElementById('fillInput');
  const val = inp.value.trim();
  if (!val) return;
  answered = true;
  inp.disabled = true;

  if (val === answer) {
    inp.classList.add('correct');
    correctCount++;
    showFeedback(true, '정답이에요! 🎉');
  } else {
    inp.classList.add('wrong');
    wrongCount++;
    wrongList.push(queue[current]);
    showFeedback(false, `틀렸어요 😢 정답: "${answer}"`);
  }
  updateScore();
  addNextBtn();
}

function renderFlash(item, area) {
  area.innerHTML = `
    <div class="drill-card" style="background:none;border:none;padding:0;">
      <div class="q-meta" style="padding:0 4px 12px;">
        <span class="q-badge">플래시 카드</span>
        <span class="q-num">${current + 1} / ${queue.length}</span>
      </div>
      <div class="flash-wrap">
        <div class="flash-card" id="flashCard" onclick="flipCard()">
          <div class="flash-face flash-front">
            <div class="flash-word">${item.w}</div>
            <div class="flash-hanja">${item.h}</div>
            <div class="flash-tap">탭하여 뜻 보기 👆</div>
          </div>
          <div class="flash-face flash-back">
            <div class="flash-meaning">${item.m}</div>
            <div class="flash-tap">탭하여 뒤집기 🔄</div>
          </div>
        </div>
      </div>
      <div class="flash-nav">
        <button onclick="prevCard()">← 이전</button>
        <button onclick="nextCard()">다음 →</button>
      </div>
    </div>`;
}

function flipCard() {
  flashFlipped = !flashFlipped;
  document.getElementById('flashCard')?.classList.toggle('flipped', flashFlipped);
}

function prevCard() {
  if (current > 0) { current--; renderCard(); }
}

function nextCard() {
  if (current < queue.length - 1) { current++; renderCard(); }
  else showResult();
}

function showFeedback(ok, msg) {
  const fb = document.getElementById('feedback');
  if (!fb) return;
  fb.innerHTML = `<div class="feedback ${ok ? 'correct' : 'wrong'}">${msg}</div>`;
}

function addNextBtn() {
  const area = document.getElementById('cardArea');
  const nb = document.createElement('button');
  nb.className = 'next-btn';
  nb.innerHTML = current + 1 < queue.length ? '다음 문제 →' : '결과 보기 🏆';
  nb.onclick = () => { current++; renderCard(); };
  const card = area.querySelector('.drill-card');
  if (card) card.appendChild(nb);
}

function drawBg() {
  const canvas = document.getElementById('bg-canvas');
  const ctx = canvas.getContext('2d');
  let W, H, dots;

  function resize() {
    W = canvas.width = window.innerWidth;
    H = canvas.height = window.innerHeight;
    dots = Array.from({length: 60}, () => ({
      x: Math.random() * W, y: Math.random() * H,
      r: Math.random() * 1.5 + 0.3,
      vx: (Math.random() - .5) * .3,
      vy: (Math.random() - .5) * .3,
      a: Math.random() * .5 + .1
    }));
  }

  function loop() {
    ctx.clearRect(0, 0, W, H);
    dots.forEach(d => {
      d.x += d.vx; d.y += d.vy;
      if (d.x < 0) d.x = W; if (d.x > W) d.x = 0;
      if (d.y < 0) d.y = H; if (d.y > H) d.y = 0;
      ctx.beginPath();
      ctx.arc(d.x, d.y, d.r, 0, Math.PI * 2);
      ctx.fillStyle = `rgba(59,130,246,${d.a * 0.4})`;
      ctx.fill();
    });
    requestAnimationFrame(loop);
  }

  window.addEventListener('resize', resize);
  resize(); loop();
}

// ── 출제 학년 토글 ───────────────────────────────────────────
let selectedGrades = new Set([1, 2, 3, 4, 5, 6]);  // 기본: 전 학년

function toggleGrade(g) {
  // 최소 1개는 선택 유지
  if (selectedGrades.has(g) && selectedGrades.size === 1) return;
  if (selectedGrades.has(g)) selectedGrades.delete(g);
  else selectedGrades.add(g);
  document.querySelectorAll('.grade-btn').forEach(b => {
    b.classList.toggle('active', selectedGrades.has(+b.dataset.g));
  });
}

function startTeamQuiz() {
  tq.teamNames = Array.from(document.querySelectorAll('.team-name-input'))
    .map((inp, i) => inp.value.trim() || (i + 1) + '모둠');
  tq.scores     = Array(tq.teamCount).fill(0);
  tq.turnScores = Array(tq.teamCount).fill(0);

  tq.turnTime = parseInt(document.getElementById('timerSelect').value);

  const qc = parseInt(document.getElementById('qCountSelect').value);

  // 선택 학년별로 각각 섞은 뒤 라운드로빈으로 섞어 학년이 고르게 분포되게
  const gradePools = [...selectedGrades].sort().map(g =>
    shuffle([...VOCAB[g]]).map(v => ({ ...v, _grade: g }))
  );
  const interleaved = [];
  const maxLen = Math.max(...gradePools.map(p => p.length));
  for (let i = 0; i < maxLen; i++) {
    for (const gp of gradePools) {
      if (i < gp.length) interleaved.push(gp[i]);
    }
  }
  const pool  = shuffle(interleaved);          // 한 번 더 섞어 완전 무작위
  tq.qCount   = qc === 0 ? pool.length : Math.min(qc, pool.length);
  tq.queue    = pool.slice(0, tq.qCount);

  tq.current     = 0;
  tq.turnStart   = 0;
  tq.currentTeam = 0;
  tq.paused      = false;
  tq.answered    = false;
  tq.allDone     = false;

  document.getElementById('teamSetupArea').style.display = 'none';
  document.getElementById('teamQuizArea').style.display  = 'block';

  showFirstTeamSelector();
}

// ── 턴 타이머 ────────────────────────────────────────────────
function startTurnTimer() {
  clearInterval(tq.timerInterval);
  if (tq.turnTime <= 0) return;      // 제한 없음
  tq.timeLeft = tq.turnTime;
  updateHeaderTimer();

  tq.timerInterval = setInterval(() => {
    if (tq.paused) return;
    tq.timeLeft--;
    updateHeaderTimer();
    if (tq.timeLeft <= 0) {
      clearInterval(tq.timerInterval);
      onTurnTimeout();
    }
  }, 1000);
}

function updateHeaderTimer() {
  // 헤더의 타이머 숫자·링 업데이트
  const numEl  = document.getElementById('tqHeaderTimerNum');
  const fillEl = document.getElementById('tqHeaderTimerFill');
  if (!numEl) return;

  const t = tq.timeLeft;
  numEl.textContent = fmtTime(t);
  numEl.style.color = t <= 10 ? '#ef4444' : t <= Math.ceil(tq.turnTime * 0.3) ? '#f59e0b' : 'var(--text)';

  if (fillEl && tq.turnTime > 0) {
    const r = 22, circ = 2 * Math.PI * r;
    const pct = t / tq.turnTime;
    fillEl.style.strokeDashoffset = circ * (1 - pct);
    fillEl.style.stroke = t <= 10 ? '#ef4444' : t <= Math.ceil(tq.turnTime * 0.3) ? '#f59e0b' : TEAM_COLORS[tq.currentTeam];
  }
}

function fmtTime(s) {
  if (s >= 60) return Math.floor(s / 60) + ':' + String(s % 60).padStart(2, '0');
  return String(s);
}

// ── 턴 타임아웃 ──────────────────────────────────────────────
function onTurnTimeout() {
  if (tq.paused) return;
  // 현재 문제 잠금
  tq.answered = true;
  document.querySelectorAll('#tqChoices .choice-btn').forEach(b => b.disabled = true);

  // 정답 표시
  const meaning = tq.queue[tq.current]?.m;
  if (meaning) {
    document.querySelectorAll('#tqChoices .choice-btn').forEach(b => {
      if (b.textContent.trim() === meaning) b.classList.add('correct');
    });
    const fb = document.getElementById('tqFeedback');
    if (fb) fb.innerHTML = `<div class="feedback wrong">⏰ 시간 종료!</div>`;
  }

  setTimeout(() => showTurnEndBanner(), 1000);
}

// ── 턴 종료 → 모둠 선택 배너 ────────────────────────────────
function showTurnEndBanner() {
  clearInterval(tq.timerInterval);
  document.getElementById('tqTurnBanner')?.remove();

  const teamIdx = tq.currentTeam;
  const name    = tq.teamNames[teamIdx];
  const color   = TEAM_COLORS[teamIdx];
  const emoji   = TEAM_EMOJIS[teamIdx];
  const solved  = tq.current - tq.turnStart;
  const gained  = tq.scores[teamIdx] - (tq._prevScore ?? 0);
  tq._prevScore = tq.scores[teamIdx];
  const noMore  = tq.current >= tq.queue.length;

  const banner = document.createElement('div');
  banner.className = 'tq-turn-banner';
  banner.id = 'tqTurnBanner';

  if (noMore) {
    // 전체 문제 소진 → 바로 결과
    banner.innerHTML = `
      <div class="tq-turn-box">
        <div class="tq-turn-emoji">🎉</div>
        <div class="tq-turn-title" style="color:${color}">${name} 턴 종료!</div>
        <div class="tq-turn-sub">
          이번 턴: <strong>${solved}문제</strong> 풀고
          <strong style="color:${color}">${gained}점</strong> 획득<br>
          <strong>전체 문제를 모두 풀었어요!</strong>
        </div>
        <button class="tq-turn-ready" style="background:#10b981"
          onclick="document.getElementById('tqTurnBanner')?.remove();showTeamResult()">
          결과 보기 🏆
        </button>
      </div>`;
  } else {
    // 모둠 선택 버튼 그리드
    const teamBtns = tq.teamNames.map((nm, i) => `
      <button class="tq-select-team-btn"
        style="border-color:${TEAM_COLORS[i]};color:${TEAM_COLORS[i]};"
        onclick="selectNextTeam(${i})">
        <span style="font-size:22px;">${TEAM_EMOJIS[i]}</span>
        <span class="tq-select-name">${nm}</span>
        <span class="tq-select-score">${tq.scores[i]}점</span>
      </button>`).join('');

    banner.innerHTML = `
      <div class="tq-turn-box" style="max-width:420px;">
        <div class="tq-turn-emoji">${emoji}</div>
        <div class="tq-turn-title" style="color:${color}">${name} 턴 종료!</div>
        <div class="tq-turn-sub" style="margin-bottom:16px;">
          이번 턴: <strong>${solved}문제</strong> 풀고
          <strong style="color:${color}">${gained}점</strong> 획득
        </div>
        <div style="font-size:13px;font-weight:700;color:var(--text-muted);margin-bottom:10px;">
          ✋ 다음에 풀 모둠을 선택하세요
        </div>
        <div class="tq-select-grid">${teamBtns}</div>
        <div style="margin-top:14px;">
          <button class="tq-turn-ready" style="background:#6b8ab0;font-size:13px;padding:10px;"
            onclick="document.getElementById('tqTurnBanner')?.remove();showTeamResult()">
            🏆 퀴즈 종료하고 결과 보기
          </button>
        </div>
      </div>`;
  }
  document.body.appendChild(banner);
}

function selectNextTeam(teamIdx) {
  document.getElementById('tqTurnBanner')?.remove();
  if (tq.current >= tq.queue.length) { showTeamResult(); return; }
  tq.currentTeam = teamIdx;
  showTurnStartBanner(teamIdx);
}

// ── 문제 렌더링 ──────────────────────────────────────────────
function renderTeamQuiz() {
  const area = document.getElementById('teamQuizArea');
  if (tq.current >= tq.queue.length) {
    clearInterval(tq.timerInterval);
    showTeamResult();
    return;
  }

  const item      = tq.queue[tq.current];
  const teamColor = TEAM_COLORS[tq.currentTeam];
  const teamName  = tq.teamNames[tq.currentTeam];
  const r = 22, circ = 2 * Math.PI * r;
  const timeFrac  = tq.turnTime > 0 ? tq.timeLeft / tq.turnTime : 1;

  const others  = VOCAB[item._grade || grade].filter(v => v.w !== item.w);
  const wrong3  = shuffle(others).slice(0, 3);
  const choices = shuffle([item, ...wrong3]);
  tq.answered   = false;

  // 학년 배지 색상
  const GRADE_COLORS = { 1:'#ec4899', 2:'#f43f8e', 3:'#3b82f6', 4:'#10b981', 5:'#f97316', 6:'#8b5cf6' };
  const gradeColor   = GRADE_COLORS[item._grade || grade] || '#6b7280';
  const gradeLabel   = item._grade ? item._grade + '학년' : grade + '학년';

  area.innerHTML = `
    <!-- 헤더: 타이머 + 현재 모둠 + 점수 요약 -->
    <div class="tq-header" style="gap:10px;align-items:center;">
      ${tq.turnTime > 0 ? `
      <div class="tq-timer-ring" style="flex-shrink:0;">
        <svg width="52" height="52" viewBox="0 0 52 52">
          <circle class="track" cx="26" cy="26" r="${r}" stroke-width="4"/>
          <circle class="fill" id="tqHeaderTimerFill" cx="26" cy="26" r="${r}"
            stroke-width="4" stroke-dasharray="${circ}"
            stroke-dashoffset="${circ * (1 - timeFrac)}"
            style="stroke:${teamColor}"/>
        </svg>
        <div class="tq-timer-num" id="tqHeaderTimerNum" style="font-size:14px;font-weight:900;">
          ${fmtTime(tq.timeLeft)}
        </div>
      </div>` : ''}
      <div class="tq-meta" style="flex:1;min-width:0;">
        <div class="tq-qnum">문제 ${tq.current + 1} / ${tq.queue.length}
          &nbsp;|&nbsp; 이번 턴 ${tq.current - tq.turnStart}문제 완료
        </div>
        <div class="tq-current-team" style="color:${teamColor}">
          ${TEAM_EMOJIS[tq.currentTeam]} ${teamName} 차례
        </div>
      </div>
      <button class="tq-pause-btn" id="pauseBtn" onclick="togglePause()">⏸ 일시정지</button>
    </div>

    <!-- 점수판 -->
    <div class="tq-scoreboard" id="tqScoreboard">
      ${tq.teamNames.map((nm, i) => `
        <div class="tq-score-chip ${i === tq.currentTeam ? 'active-team' : ''}" id="chip_${i}">
          <div class="tq-chip-name" style="color:${TEAM_COLORS[i]}">${TEAM_EMOJIS[i]} ${nm}</div>
          <div class="tq-chip-score" id="score_${i}">${tq.scores[i]}</div>
          <div class="tq-chip-label">점</div>
        </div>`).join('')}
    </div>

    <!-- 문제 카드 -->
    <div class="tq-card" id="tqCard" style="border-color:${teamColor}40;">
      <div class="q-meta">
        <span class="q-badge" style="background:${teamColor}18;color:${teamColor}">
          ${TEAM_EMOJIS[tq.currentTeam]} ${teamName}
        </span>
        <span class="q-badge" style="background:${gradeColor}15;color:${gradeColor};margin-left:4px;">
          📚 ${gradeLabel}
        </span>
        <span class="q-num">${tq.current + 1} / ${tq.queue.length}</span>
      </div>
      <div class="q-word">${item.w}</div>
      <div class="q-hanja">${item.h}</div>
      <div class="choices" id="tqChoices">
        ${choices.map(c => `
          <button class="choice-btn"
            onclick="checkTeamChoice(this,'${c.w === item.w}','${item.m.replace(/'/g,"\\'")}')">
            ${c.m}
          </button>`).join('')}
      </div>
      <div id="tqFeedback"></div>
    </div>`;
}

// ── 정답 확인 ────────────────────────────────────────────────
function checkTeamChoice(btn, isCorrect, meaning) {
  if (tq.answered || tq.paused) return;
  tq.answered = true;

  document.querySelectorAll('#tqChoices .choice-btn').forEach(b => {
    b.disabled = true;
    if (b.textContent.trim() === meaning) b.classList.add('correct');
  });

  const fb = document.getElementById('tqFeedback');
  if (isCorrect === 'true') {
    btn.classList.add('correct');
    tq.scores[tq.currentTeam]++;
    const scoreEl = document.getElementById('score_' + tq.currentTeam);
    if (scoreEl) {
      scoreEl.textContent = tq.scores[tq.currentTeam];
      scoreEl.closest('.tq-score-chip').classList.add('tq-score-bump');
      setTimeout(() => scoreEl.closest('.tq-score-chip')?.classList.remove('tq-score-bump'), 500);
    }
    spawnConfetti(20);
    if (fb) fb.innerHTML = `<div class="feedback correct">정답! 🎉 +1점</div>`;
  } else {
    btn.classList.add('wrong');
    document.getElementById('tqCard')?.classList.add('shake');
    setTimeout(() => document.getElementById('tqCard')?.classList.remove('shake'), 400);
    if (fb) fb.innerHTML = `<div class="feedback wrong">아쉬워요 😢 정답: "${meaning}"</div>`;
  }

  // 0.9초 후 자동으로 다음 문제 (타이머는 계속 진행)
  setTimeout(() => {
    if (tq.timeLeft <= 0 && tq.turnTime > 0) return; // 타임아웃이 먼저 온 경우
    tq.current++;
    if (tq.current >= tq.queue.length) {
      clearInterval(tq.timerInterval);
      showTurnEndBanner();
    } else {
      renderTeamQuiz();
    }
  }, 900);
}

// ── 일시정지 ─────────────────────────────────────────────────
function togglePause() {
  tq.paused = !tq.paused;
  const btn = document.getElementById('pauseBtn');
  if (btn) btn.innerHTML = tq.paused ? '▶ 계속' : '⏸ 일시정지';
  document.querySelectorAll('#tqChoices .choice-btn').forEach(b => {
    if (!tq.answered) b.disabled = tq.paused;
  });
}

// ── 결과 ─────────────────────────────────────────────────────
function showTeamResult() {
  clearInterval(tq.timerInterval);
  document.getElementById('tqTurnBanner')?.remove();
  document.getElementById('teamQuizArea').style.display = 'none';
  const area = document.getElementById('teamResultArea');
  area.style.display = 'block';

  const ranked = tq.teamNames
    .map((nm, i) => ({ name: nm, score: tq.scores[i], color: TEAM_COLORS[i], emoji: TEAM_EMOJIS[i] }))
    .sort((a, b) => b.score - a.score);

  const medals    = ['🥇','🥈','🥉'];
  const rankClass = ['gold','silver','bronze'];

  let podiumHTML = '';
  if (ranked.length >= 3) {
    const heights = [80, 110, 60];
    podiumHTML = `
      <div class="tq-podium">
        ${[1,0,2].map((ri, pi) => {
          const r = ranked[ri];
          return r ? `
            <div class="tq-podium-item">
              <div class="tq-podium-name">${r.emoji} ${r.name}</div>
              <div class="tq-podium-score-num" style="color:${r.color}">${r.score}점</div>
              <div class="tq-podium-block" style="background:${r.color};width:70px;height:${heights[pi]}px">
                ${medals[ri] || ri+1}
              </div>
            </div>` : '';
        }).join('')}
      </div>`;
  }

  const turnsPerTeam = Math.ceil(tq.teamCount > 0 ? tq.queue.length / tq.teamCount : 1);

  area.innerHTML = `
    <div class="result-emoji">🏆</div>
    <div class="tq-result-title">${grade}학년 모둠 퀴즈 결과</div>
    ${podiumHTML}
    <div class="tq-rank-list">
      ${ranked.map((r, i) => `
        <div class="tq-rank-row ${rankClass[i] || ''}">
          <div class="tq-rank-num">${medals[i] || (i+1)+'위'}</div>
          <div class="tq-rank-name" style="color:${r.color}">${r.emoji} ${r.name}</div>
          <div>
            <span class="tq-rank-score">${r.score}</span>
            <span class="tq-rank-pts">점</span>
          </div>
        </div>`).join('')}
    </div>
    <div style="color:var(--text-muted);font-size:13px;margin-bottom:24px;">
      총 ${tq.queue.length}문제 ·
      ${tq.turnTime > 0 ? '턴당 ' + fmtTime(tq.turnTime) + ' 제한' : '시간 제한 없음'}
    </div>
    <div class="tq-result-btns">
      <button class="result-btn primary" onclick="restartTeamQuiz()">🔄 다시 시작</button>
      <button class="result-btn secondary" onclick="setMode('team')">⚙ 설정 변경</button>
      <button class="result-btn secondary" onclick="setMode('choice')">🎯 개인 드릴</button>
    </div>`;

  spawnConfetti(80);
}

function restartTeamQuiz() {
  document.getElementById('teamResultArea').style.display = 'none';
  startTeamQuiz();
}

function spawnConfetti(count = 30) {
  const wrap   = document.createElement('div');
  wrap.className = 'confetti-wrap';
  document.body.appendChild(wrap);
  const colors = ['#3b82f6','#f43f8e','#10b981','#f59e0b','#8b5cf6','#f97316'];
  for (let i = 0; i < count; i++) {
    const p = document.createElement('div');
    p.className = 'confetti-particle';
    p.style.left = Math.random() * 100 + 'vw';
    p.style.background = colors[Math.floor(Math.random() * colors.length)];
    p.style.animationDuration = (1.5 + Math.random() * 2) + 's';
    p.style.animationDelay   = Math.random() * 0.5 + 's';
    p.style.width = p.style.height = (6 + Math.random() * 8) + 'px';
    p.style.borderRadius = Math.random() > 0.5 ? '50%' : '2px';
    wrap.appendChild(p);
  }
  setTimeout(() => wrap.remove(), 3500);
}

init();
</script>

<!-- 어휘 상세 모달 -->
<div id="vocabModal" class="vocab-modal-overlay" style="display:none" onclick="closeVocabModal(event)">
  <div class="vocab-modal">
    <button class="vocab-modal-close" onclick="closeVocabModal()">✕</button>
    <div class="vocab-modal-num" id="modalNum"></div>
    <div class="vocab-modal-word" id="modalWord"></div>
    <div class="vocab-modal-hanja" id="modalHanja"></div>
    <div class="vocab-modal-divider"></div>
    <div class="vocab-modal-meaning" id="modalMeaning"></div>
    <div class="vocab-modal-nav">
      <button onclick="modalMove(-1)">← 이전</button>
      <button class="primary" onclick="closeVocabModal()">닫기</button>
      <button onclick="modalMove(1)">다음 →</button>
    </div>
  </div>
</div>
